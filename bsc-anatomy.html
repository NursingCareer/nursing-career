<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURSING CAREER — BSc Nursing Anatomy Module</title>
<style>
:root{--bg:#0a0f0d;--bg2:#111a16;--card:#162220;--card2:#1a2b27;--accent:#00c9a7;--accent2:#00e6bf;--accent3:#ff6b6b;--accent4:#ffd93d;--text:#e8f0ec;--text2:#a3b8b0;--text3:#6b8a80;--border:#1e3a33;--shadow:0 4px 20px rgba(0,0,0,.4);--radius:14px;--radius2:10px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;overflow-x:hidden}
::selection{background:var(--accent);color:#000}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
a{color:var(--accent);text-decoration:none}
.app{max-width:900px;margin:0 auto;padding:0 12px}
/* HEADER */
.top-bar{position:sticky;top:0;z-index:100;background:rgba(10,15,13,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 0;margin-bottom:4px}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),#007a63);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;flex-shrink:0}
.brand-text h1{font-size:15px;font-weight:800;letter-spacing:1.5px;color:var(--accent);line-height:1.2}
.brand-text p{font-size:10px;color:var(--text2);letter-spacing:.5px}
.search-box{flex:1;max-width:260px;position:relative}
.search-box input{width:100%;padding:8px 12px 8px 32px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:.3s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,201,167,.15)}
.search-box::before{content:'🔍';position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px}
.nav-btns{display:flex;gap:6px}
.nav-btn{padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:12px;cursor:pointer;transition:.2s;white-space:nowrap}
.nav-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
/* HERO */
.hero{text-align:center;padding:30px 0 20px}
.hero h2{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;margin-bottom:6px}
.hero p{color:var(--text2);font-size:14px}
.hero-stats{display:flex;justify-content:center;gap:20px;margin-top:16px;flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat .num{font-size:24px;font-weight:900;color:var(--accent)}
.hero-stat .lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
/* SYSTEM GRID */
.section-title{font-size:18px;font-weight:800;color:var(--text);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:30px}
.sys-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 10px;text-align:center;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.sys-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.sys-card .ico{font-size:28px;margin-bottom:6px;display:block}
.sys-card .sname{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.sys-card .scnt{font-size:10px;color:var(--text3);margin-top:2px}
.sys-card .sbar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--accent);opacity:.3}
/* SYSTEM DETAIL PAGE */
.sys-page{display:none}
.sys-page.active{display:block}
.sys-header{padding:20px 0 10px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sys-header h2{font-size:22px;font-weight:900;color:var(--accent);margin-bottom:4px}
.sys-header p{font-size:13px;color:var(--text2)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);margin-bottom:10px;flex-wrap:wrap}
.breadcrumb a{color:var(--accent);cursor:pointer}
/* TABS */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{height:3px}
.tab{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.2s;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
/* CONTENT PANELS */
.panel{display:none;animation:fadeUp .3s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.content-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;margin-bottom:12px}
.content-block h3{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.content-block h4{font-size:13px;font-weight:600;color:var(--accent2);margin:10px 0 4px}
.content-block p,.content-block li{font-size:13px;color:var(--text2);line-height:1.7}
.content-block ul{padding-left:18px;margin:4px 0}
.content-block li{margin-bottom:3px}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-right:4px}
.badge-easy{background:#1a3a2a;color:#4ade80}
.badge-mod{background:#3a3a1a;color:#facc15}
.badge-hy{background:#3a1a1a;color:#f87171}
.badge-lvl{background:var(--card2);color:var(--accent);border:1px solid var(--border)}
/* DIAGRAM */
.diagram-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px;margin-bottom:12px;text-align:center;overflow-x:auto}
.diagram-box svg{max-width:100%;height:auto}
.diagram-box .diag-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px}
.identify-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:12px;margin-bottom:12px}
.identify-box h4{font-size:13px;font-weight:700;color:var(--accent4);margin-bottom:6px}
.identify-box li{font-size:12px;color:var(--text2);margin-bottom:2px}
/* MCQ */
.mcq-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:10px;transition:.3s}
.mcq-card .q-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.mcq-card .q-num{font-size:12px;font-weight:800;color:var(--accent);min-width:30px}
.mcq-card .q-text{font-size:13px;font-weight:600;color:var(--text);flex:1}
.mcq-opt{display:block;padding:8px 12px;margin:4px 0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text2);cursor:pointer;transition:.2s;width:100%;text-align:left}
.mcq-opt:hover{border-color:var(--accent);color:var(--text)}
.mcq-opt.selected{border-color:var(--accent);background:rgba(0,201,167,.1);color:var(--text)}
.mcq-opt.correct{border-color:#4ade80;background:rgba(74,222,128,.12);color:#4ade80}
.mcq-opt.wrong{border-color:#f87171;background:rgba(248,113,113,.12);color:#f87171}
.mcq-expl{margin-top:8px;padding:10px;background:rgba(0,201,167,.06);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:12px;color:var(--text2);display:none}
.mcq-expl.show{display:block}
