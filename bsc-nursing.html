<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>B.Sc. in Nursing | Nursing Career</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f3f7fc;
  color:#172033;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#0759a5,#246be8);
  color:white;
  padding:18px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  position:sticky;
  top:0;
  z-index:1000;

  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo{
  font-size:21px;
  font-weight:800;
}

.home{
  background:white;
  color:#0759a5;

  padding:9px 16px;

  border-radius:20px;

  font-weight:bold;
}


/* HERO */

.hero{
  background:linear-gradient(135deg,#0759a5,#2374ed);

  color:white;

  text-align:center;

  padding:45px 20px 60px;

  border-radius:0 0 45px 45px;
}

.hero h1{
  font-size:34px;
  margin-bottom:12px;
}

.hero p{
  max-width:650px;
  margin:auto;

  font-size:17px;
  line-height:1.6;
}


/* MAIN CONTAINER */

.container{
  max-width:900px;

  margin:-25px auto 40px;

  padding:0 18px;

  position:relative;

  z-index:5;
}


/* INTRO */

.intro{
  background:white;

  border-radius:28px;

  padding:30px 20px;

  text-align:center;

  box-shadow:0 10px 35px rgba(0,0,0,.08);

  margin-bottom:28px;
}

.intro h2{
  color:#0759a5;

  font-size:30px;

  margin-bottom:10px;
}

.intro p{
  color:#666;

  font-size:16px;

  line-height:1.6;
}


/* YEAR */

.year{
  background:white;

  border-radius:28px;

  overflow:hidden;

  margin-bottom:30px;

  box-shadow:0 8px 28px rgba(0,0,0,.08);
}

.year-head{
  background:linear-gradient(135deg,#0759a5,#2869e8);

  color:white;

  padding:25px;
}

.year-head h2{
  font-size:28px;

  margin-bottom:7px;
}

.year-head p{
  font-size:16px;

  opacity:.95;
}


/* SUBJECT LIST */

.subject-list{
  padding:22px;
}


/* SUBJECT CARD */

.subject{
  display:flex;

  align-items:center;

  gap:20px;

  background:#f9fbff;

  border:1px solid #e1e7ef;

  border-radius:24px;

  padding:22px;

  margin-bottom:18px;

  transition:.25s;

  position:relative;

  z-index:20;
}

.subject:last-child{
  margin-bottom:0;
}

.subject:hover{
  transform:translateY(-3px);

  box-shadow:0 8px 22px rgba(0,0,0,.10);

  border-color:#3a79e8;
}


/* CLICKABLE ANATOMY */

.anatomy-card{
  cursor:pointer;

  -webkit-tap-highlight-color:transparent;

  user-select:none;
}


/* ICON */

.icon{
  width:90px;

  height:90px;

  min-width:90px;

  border-radius:22px;

  background:#e4f2ff;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:45px;
}


/* SUBJECT TEXT */

.subject h3{
  font-size:21px;

  margin-bottom:7px;

  color:#172033;
}

.subject p{
  color:#777;

  font-size:15px;

  line-height:1.4;
}


/* FOOTER */

.footer{
  background:#10233f;

  color:white;

  text-align:center;

  padding:35px 20px;

  margin-top:40px;
}

.footer h3{
  margin-bottom:8px;
}

.footer p{
  color:#cbd5e1;

  font-size:14px;

  line-height:1.6;
}


/* MOBILE */

@media(max-width:600px){

  .hero h1{
    font-size:27px;
