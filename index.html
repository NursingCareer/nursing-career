<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nursing Career — Premium Learning Platform</title>
<meta name="description" content="Nursing Career — MCQ practice, nursing notes, progress tracking and admin tools.">
<style>
:root{--bg:#071f20;--panel:#0d2d2f;--card:#fff;--ink:#173033;--muted:#708083;--brand:#10a39a;--brand2:#087f79;--line:#dce7e7;--soft:#eef8f7;--danger:#dc4b58;--shadow:0 22px 60px rgba(0,0,0,.16);--r:22px}*{box-sizing:border-box}html,body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f8f8;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.auth{min-height:100vh;background:radial-gradient(circle at 50% 25%,#173c3e,#082425 58%,#061c1d);display:flex;align-items:center;justify-content:center;padding:28px}.auth-card{width:min(590px,100%);background:#fff;border-radius:36px;padding:40px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.brand{text-align:center;margin-bottom:26px}.logo{width:62px;height:62px;margin:auto;border-radius:20px;background:linear-gradient(135deg,var(--brand),#7bded8);display:grid;place-items:center;color:white;font-size:31px;font-weight:900;box-shadow:0 12px 28px rgba(16,163,154,.28)}h1,h2,h3,p{margin-top:0}.brand h1{margin:14px 0 5px;font-size:31px}.brand p{color:var(--muted);margin:0}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:20px 0 26px}.tab{padding:15px;border:0;background:transparent;color:#7b888a;font-size:20px;font-weight:800}.tab.active{color:var(--brand);border-bottom:4px solid var(--brand)}label{display:block;font-weight:800;margin:16px 0 8px}input,select,textarea{width:100%;border:1px solid var(--line);background:#fbfdfd;border-radius:15px;padding:15px 16px;outline:none;color:var(--ink)}input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(16,163,154,.1)}.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(16,163,154,.22)}.secondary{background:var(--soft);color:var(--brand2)}.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f1;color:var(--danger)}.full{width:100%;margin-top:20px}.demo{margin-top:22px;padding:13px 15px;border-radius:14px;background:#f2f7f7;text-align:center;color:#7b888a;font-size:14px}.shell{min-height:100vh;background:#f4f8f8}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.top-left{display:flex;align-items:center;gap:12px}.mini-logo{width:42px;height:42px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}.topbar strong{font-size:19px}.user-actions{display:flex;align-items:center;gap:9px}.avatar{width:40px;height:40px;border-radius:50%;background:#d8f2f0;color:var(--brand2);display:grid;place-items:center;font-weight:900}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 74px)}.sidebar{background:#082526;color:#d6eeee;padding:22px 15px}.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#789697;padding:12px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#b8d0d0;text-align:left;padding:13px 14px;border-radius:12px;font-weight:700}.nav button:hover,.nav button.active{background:#123b3c;color:#fff}.content{padding:30px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}.page-head h2{font-size:29px;margin-bottom:5px}.page-head p{color:var(--muted);margin:0}.search{min-width:300px;position:relative}.search input{padding-left:43px}.search span{position:absolute;left:15px;top:13px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid #e4eded;border-radius:var(--r);padding:22px;box-shadow:0 8px 25px rgba(13,45,47,.05)}.stat{display:flex;align-items:center;justify-content:space-between}.stat .num{font-size:30px;font-weight:900;margin:8px 0}.muted{color:var(--muted)}.iconbox{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:22px}.two{grid-template-columns:1.3fr .7fr}.three{grid-template-columns:repeat(3,1fr)}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.section-title h3{margin:0}.subject{min-height:130px;display:flex;flex-direction:column;justify-content:space-between}.subject .tag,.tag{display:inline-flex;padding:6px 10px;border-radius:99px;background:#e8f7f5;color:#087f79;font-size:12px;font-weight:800}.subject h3{margin:12px 0 4px}.progress{height:9px;background:#e8eeee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#72d8d1);border-radius:inherit}.note-card{display:flex;gap:15px;align-items:center}.pdf{width:52px;height:62px;border-radius:12px;background:#fff0f1;color:#d34a55;display:grid;place-items:center;font-weight:900}.note-card h3{margin:0 0 5px}.note-card .actions{margin-left:auto;display:flex;gap:8px}.mcq-card{max-width:900px;margin:auto}.q-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.question{font-size:24px;line-height:1.45;margin:24px 0}.options{display:grid;gap:11px}.option{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;font-weight:700}.option:hover{border-color:var(--brand);background:#f7fcfc}.option.correct{background:#e9f8ef;border-color:#40a968}.option.wrong{background:#fff0f1;border-color:#df6570}.result{text-align:center;padding:30px}.score{font-size:58px;font-weight:950;color:var(--brand)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.modal{position:fixed;inset:0;background:rgba(3,19,20,.65);display:grid;place-items:center;padding:20px;z-index:50}.modal-card{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef4f4;width:38px;height:38px;border-radius:50%}.toast{position:fixed;right:20px;bottom:20px;background:#092728;color:#fff;padding:13px 17px;border-radius:13px;z-index:100;box-shadow:var(--shadow)}.empty{text-align:center;padding:45px;color:var(--muted)}.mobile-menu{display:none}.admin-only{display:none}.is-admin .admin-only{display:block}.is-admin .admin-nav{display:block}.admin-nav{display:none}.note-reader{white-space:pre-wrap;line-height:1.8;color:#405255}.quiz-list{display:grid;gap:12px}.quiz-item{padding:15px;border:1px solid var(--line);border-radius:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:13px}.footer{text-align:center;color:#829092;padding:30px}.back{display:none}
@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:block;position:fixed;top:74px;bottom:0;left:0;width:260px;z-index:30;box-shadow:10px 0 30px rgba(0,0,0,.2)}.mobile-menu{display:block}.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.content{padding:20px}.page-head{flex-direction:column}.search{width:100%;min-width:0}}
@media(max-width:560px){.auth{padding:12px}.auth-card{padding:28px 22px;border-radius:28px}.topbar{padding:0 14px}.topbar strong{font-size:16px}.content{padding:16px}.stats{grid-template-columns:1fr 1fr;gap:10px}.card{padding:17px}.question{font-size:20px}.user-actions .hide-sm{display:none}.page-head h2{font-size:24px}.note-card{align-items:flex-start}.note-card .actions{margin-left:0}.note-card{flex-wrap:wrap}}
</style></head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
const defaultMCQs=[
{id:1,subject:'Fundamentals',q:'Which position is commonly used to examine a patient’s back and spine?',o:['Supine','Prone','Lithotomy','Fowler’s'],a:1,e:'Prone position places the patient on the abdomen and allows examination of the back.'},
{id:2,subject:'Anatomy',q:'The functional unit of the kidney is the—',o:['Neuron','Nephron','Alveolus','Osteon'],a:1,e:'The nephron is the structural and functional unit of the kidney.'},
{id:3,subject:'Medical-Surgical',q:'Which sign is most associated with hypoglycemia?',o:['Sweating and tremor','Dry skin','Bradycardia only','Jaundice'],a:0,e:'Adrenergic symptoms such as sweating, tremor and palpitations are common in hypoglycemia.'},
{id:4,subject:'Midwifery',q:'The first stage of labour ends when—',o:['The baby is born','The placenta is delivered','The cervix is fully dilated','Contractions stop'],a:2,e:'The first stage ends at complete cervical dilatation, generally 10 cm.'},
{id:5,subject:'Community Health',q:'The main purpose of immunization is to—',o:['Treat infection','Prevent vaccine-preventable disease','Replace antibiotics','Reduce blood pressure'],a:1,e:'Vaccination prepares the immune system to prevent specific infectious diseases.'},
{id:6,subject:'Pharmacology',q:'Which route generally gives the fastest systemic drug effect?',o:['Oral','Intramuscular','Intravenous','Topical'],a:2,e:'IV administration delivers medication directly into the bloodstream.'},
{id:7,subject:'Pediatrics',q:'A newborn’s normal transition after birth includes initiation of—',o:['Respiration','Menstruation','Digestion of solid food','Ambulation'],a:0,e:'Establishment of effective breathing is one of the key immediate transitions after birth.'},
{id:8,subject:'Fundamentals',q:'The most effective basic measure for preventing spread of infection is—',o:['Hand hygiene','Room decoration','Bed rest','Warm clothing'],a:0,e:'Proper hand hygiene is a cornerstone of infection prevention.'}
];
const defaultNotes=[
{id:1,title:'Nursing Fundamentals — Master Notes',subject:'Fundamentals',type:'PDF',text:'Core nursing principles\n\n• Nursing process: Assessment → Diagnosis → Planning → Implementation → Evaluation.\n• Maintain patient safety, privacy and dignity.\n• Hand hygiene is essential before and after patient contact.\n• Document observations, interventions and responses accurately.'},
{id:2,title:'Medical-Surgical Nursing — Rapid Revision',subject:'Medical-Surgical',type:'PDF',text:'High-yield revision\n\n• Monitor vital signs and trends.\n• Assess airway, breathing and circulation first in emergencies.\n• Recognize deterioration early and escalate appropriately.\n• Patient education should be clear, relevant and documented.'},
{id:3,title:'Midwifery — Labour & Delivery',subject:'Midwifery',type:'PDF',text:'Labour essentials\n\n• First stage: onset of true labour to full cervical dilatation.\n• Second stage: full dilatation to birth of the baby.\n• Third stage: birth of baby to delivery of placenta.\n• Monitor mother and fetus according to local protocol.'},
{id:4,title:'Pharmacology — Exam Quick Sheet',subject:'Pharmacology',type:'PDF',text:'Drug administration\n\n• Check the right patient, drug, dose, route, time and documentation.\n• Assess allergies and relevant contraindications.\n• Observe therapeutic and adverse effects.\n• Never administer an unfamiliar medication without checking a reliable reference.'}
];
const subjects=['All','Fundamentals','Anatomy','Medical-Surgical','Midwifery','Community Health','Pharmacology','Pediatrics'];
let state={user:null,page:'home',quiz:null,query:'',subject:'All',mcqs:[],notes:[],scores:[]};
function load(){state.mcqs=JSON.parse(localStorage.getItem('nc_mcqs')||'null')||defaultMCQs;state.notes=JSON.parse(localStorage.getItem('nc_notes')||'null')||defaultNotes;state.scores=JSON.parse(localStorage.getItem('nc_scores')||'[]');state.user=JSON.parse(localStorage.getItem('nc_user')||'null')}
function save(){localStorage.setItem('nc_mcqs',JSON.stringify(state.mcqs));localStorage.setItem('nc_notes',JSON.stringify(state.notes));localStorage.setItem('nc_scores',JSON.stringify(state.scores))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.add('hidden'),2200)}
function showModal(html){const m=document.getElementById('modal');m.innerHTML='<div class="modal-card">'+html+'</div>';m.classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function loginView(){return `<main class="auth"><div class="auth-card"><div class="brand"><div class="logo">✚</div><h1>Nursing Career</h1><p>Premium nursing exam preparation platform</p></div><div class="tabs"><button class="tab active" id="loginTab">Login</button><button class="tab" id="signupTab">Create account</button></div><form id="authForm"><label>Email</label><input id="email" type="email" placeholder="you@example.com" required><label>Password</label><input id="password" type="password" placeholder="••••••••" required><button class="btn primary full">Login →</button></form><div class="demo">Demo student: <b>student@nursingcareer.com</b> / <b>123456</b><br>Admin: <b>admin@nursingcareer.com</b> / <b>admin123</b></div></div></main>`}
function render(){if(!state.user){document.getElementById('app').innerHTML=loginView();bindAuth();return}document.body.classList.toggle('is-admin',state.user.role==='admin');document.getElementById('app').innerHTML=`<div class="shell"><header class="topbar"><div class="top-left"><button class="btn ghost mobile-menu" id="menu">☰</button><div class="mini-logo">✚</div><strong>Nursing Career</strong></div><div class="user-actions"><button class="btn ghost hide-sm" onclick="toggleTheme()">◐ Theme</button><div class="avatar">${esc((state.user.name||state.user.email)[0].toUpperCase())}</div><button class="btn ghost" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="sidebar" id="sidebar"><div class="nav-title">Learning</div><nav class="nav"><button data-page="home">⌂ Dashboard</button><button data-page="mcq">✓ MCQ Practice</button><button data-page="notes">▣ PDF Notes</button><button data-page="subjects">◈ Subjects</button><button data-page="progress">◒ My Progress</button><div class="admin-nav"><div class="nav-title">Administration</div><button data-page="admin">⚙ Admin Panel</button></div></nav></aside><main class="content">${pageHTML()}</main></div><div class="footer">Nursing Career • Built for focused nursing exam preparation</div></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;document.getElementById('sidebar').classList.remove('open');render()});document.getElementById('menu')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));}
function pageHTML(){switch(state.page){case'mcq':return mcqPage();case'notes':return notesPage();case'subjects':return subjectsPage();case'progress':return progressPage();case'admin':return state.user.role==='admin'?adminPage():homePage();default:return homePage()}}
function head(title,sub,search=false){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div>${search?`<div class="search"><span>⌕</span><input id="globalSearch" value="${esc(state.query)}" placeholder="Search MCQs, notes, subjects..."></div>`:''}</div>`}
function homePage(){const attempted=state.scores.reduce((a,b)=>a+b.total,0),correct=state.scores.reduce((a,b)=>a+b.correct,0),avg=attempted?Math.round(correct/attempted*100):0;return head(`Welcome, ${esc(state.user.name||'Learner')} 👋`,'Your nursing exam preparation dashboard',true)+`<div class="grid stats"><div class="card stat"><div><span class="muted">Questions</span><div class="num">${state.mcqs.length}</div><span class="small muted">Practice bank</span></div><div class="iconbox">✓</div></div><div class="card stat"><div><span class="muted">Notes</span><div class="num">${state.notes.length}</div><span class="small muted">Study resources</span></div><div class="iconbox">▣</div></div><div class="card stat"><div><span class="muted">Attempts</span><div class="num">${state.scores.length}</div><span class="small muted">Completed quizzes</span></div><div class="iconbox">◒</div></div><div class="card stat"><div><span class="muted">Accuracy</span><div class="num">${avg}%</div><span class="small muted">Overall practice</span></div><div class="iconbox">★</div></div></div><br><div class="grid two"><section class="card"><div class="section-title"><h3>Quick Practice</h3><button class="btn secondary" onclick="state.page='mcq';render()">Start MCQ →</button></div><p class="muted">Practice a 10-question mixed quiz with instant explanations and a final score.</p><div class="grid three">${['Fundamentals','Midwifery','Medical-Surgical'].map(s=>`<div class="card subject"><span class="tag">${s}</span><h3>Exam Focus</h3><button class="btn ghost" onclick="startQuiz('${s}')">Practice</button></div>`).join('')}</div></section><section class="card"><div class="section-title"><h3>Recent Scores</h3><button class="btn ghost" onclick="state.page='progress';render()">View all</button></div>${state.scores.length?state.scores.slice(-4).reverse().map(s=>`<div class="quiz-item"><div><b>${esc(s.subject)}</b><div class="small muted">${new Date(s.date).toLocaleString()}</div></div><strong>${s.correct}/${s.total}</strong></div>`).join(''):'<div class="empty">No quiz attempts yet.</div>'}</section></div>`}
function mcqPage(){if(state.quiz)return quizRunner();const filtered=filteredMCQ();return head('MCQ Practice','Choose a subject and start an exam-style quiz',true)+`<div class="card"><div class="section-title"><h3>Subject</h3><select id="quizSubject" style="max-width:300px"><option>All</option>${subjects.slice(1).map(s=>`<option>${s}</option>`).join('')}</select></div><div class="grid three">${subjects.slice(1).map(s=>{const n=state.mcqs.filter(q=>q.subject===s).length;return `<div class="card subject"><span class="tag">${s}</span><div><h3>${n} questions</h3><p class="muted small">Focused revision set</p></div><button class="btn primary" onclick="startQuiz('${s}')">Start Quiz</button></div>`}).join('')}</div></div><br><div class="card"><div class="section-title"><h3>Question Bank</h3><span class="muted">${filtered.length} matching</span></div><div class="quiz-list">${filtered.slice(0,20).map((q,i)=>`<div class="quiz-item"><div><span class="tag">${esc(q.subject)}</span><p style="margin:8px 0 0"><b>Q${i+1}.</b> ${esc(q.q)}</p></div><button class="btn ghost" onclick="practiceSingle(${q.id})">Practice</button></div>`).join('')}</div></div>`}
function filteredMCQ(){let a=state.mcqs;if(state.subject!=='All')a=a.filter(q=>q.subject===state.subject);if(state.query.trim())a=a.filter(q=>(q.q+' '+q.subject+' '+q.o.join(' ')).toLowerCase().includes(state.query.toLowerCase()));return a}
function startQuiz(subject='All'){let pool=subject==='All'?state.mcqs:state.mcqs.filter(q=>q.subject===subject);if(!pool.length)return toast('No questions in this subject');pool=[...pool].sort(()=>Math.random()-.5).slice(0,10);state.quiz={subject,items:pool,index:0,correct:0,answered:false,selected:null};state.page='mcq';render()}
function practiceSingle(id){const q=state.mcqs.find(x=>x.id===id);state.quiz={subject:q.subject,items:[q],index:0,correct:0,answered:false,selected:null};render()}
function quizRunner(){const z=state.quiz,q=z.items[z.index];return head('MCQ Practice',`${esc(z.subject)} • Question ${z.index+1} of ${z.items.length}`)+`<section class="card mcq-card"><div class="q-meta"><span>Progress ${Math.round(z.index/z.items.length*100)}%</span><span>${z.correct} correct</span></div><br><div class="progress"><i style="width:${(z.index/z.items.length)*100}%"></i></div><div class="question">${esc(q.q)}</div><div class="options">${q.o.map((o,i)=>`<button class="option ${z.answered?(i===q.a?'correct':i===z.selected?'wrong':''):''}" ${z.answered?'disabled':''} onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${z.answered?`<div class="card" style="margin-top:18px;background:#f7fbfb"><b>${z.selected===q.a?'Correct ✓':'Review ✕'}</b><p class="muted" style="margin:8px 0 0">${esc(q.e)}</p><button class="btn primary" style="margin-top:12px" onclick="nextQuestion()">${z.index===z.items.length-1?'Finish Quiz':'Next Question →'}</button></div>`:''}<button class="btn ghost" style="margin-top:18px" onclick="state.quiz=null;render()">Exit Quiz</button></section>`}
function answer(i){if(state.quiz.answered)return;state.quiz.selected=i;state.quiz.answered=true;if(i===state.quiz.items[state.quiz.index].a)state.quiz.correct++;render()}
function nextQuestion(){if(state.quiz.index===state.quiz.items.length-1){const z=state.quiz;state.scores.push({subject:z.subject,total:z.items.length,correct:z.correct,date:new Date().toISOString()});save();state.quiz=null;showResult(z.correct,z.items.length,z.subject);return}state.quiz.index++;state.quiz.answered=false;state.quiz.selected=null;render()}
function showResult(c,t,s){showModal(`<div class="result"><div class="score">${Math.round(c/t*100)}%</div><h2>Quiz Complete</h2><p class="muted">${c} correct out of ${t} • ${esc(s)}</p><button class="btn primary" onclick="closeModal();state.page='progress';render()">View Progress</button> <button class="btn ghost" onclick="closeModal();state.page='mcq';render()">Practice Again</button></div>`)}
function notesPage(){let n=state.notes.filter(x=>{const hay=(x.title+' '+x.subject).toLowerCase();return !state.query||hay.includes(state.query.toLowerCase())});return head('PDF Notes','High-yield study notes and revision sheets',true)+`<div class="grid two">${n.map(x=>`<div class="card note-card"><div class="pdf">PDF</div><div><h3>${esc(x.title)}</h3><span class="tag">${esc(x.subject)}</span></div><div class="actions"><button class="btn secondary" onclick="readNote(${x.id})">Read</button><button class="btn ghost" onclick="downloadNote(${x.id})">Save</button></div></div>`).join('')}</div>${!n.length?'<div class="card empty">No notes found.</div>':''}`}
function readNote(id){const n=state.notes.find(x=>x.id===id);showModal(`<div class="modal-head"><div><h2>${esc(n.title)}</h2><span class="tag">${esc(n.subject)}</span></div><button class="close" onclick="closeModal()">×</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="note-reader">${esc(n.text)}</div><button class="btn primary full" onclick="downloadNote(${id})">Save as text file</button>`)}
function downloadNote(id){const n=state.notes.find(x=>x.id===id);const blob=new Blob([n.title+'\n\n'+n.text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.txt';a.click();URL.revokeObjectURL(a.href);toast('Note saved')}
function subjectsPage(){return head('Subjects','Browse the nursing curriculum by subject')+`<div class="grid three">${subjects.slice(1).map(s=>{const q=state.mcqs.filter(x=>x.subject===s).length,n=state.notes.filter(x=>x.subject===s).length;return `<div class="card subject"><span class="tag">${s}</span><div><h3>${q} MCQs</h3><p class="muted">${n} study notes available</p></div><div><button class="btn primary" onclick="startQuiz('${s}')">Practice</button> <button class="btn ghost" onclick="state.page='notes';state.query='${s}';render()">Notes</button></div></div>`}).join('')}</div>`}
function progressPage(){const total=state.scores.reduce((a,b)=>a+b.total,0),correct=state.scores.reduce((a,b)=>a+b.correct,0),acc=total?Math.round(correct/total*100):0;const by={};state.scores.forEach(s=>{by[s.subject]??={t:0,c:0};by[s.subject].t+=s.total;by[s.subject].c+=s.correct});return head('My Progress','Track practice attempts and accuracy')+`<div class="grid stats"><div class="card"><span class="muted">Total Attempts</span><div class="num">${state.scores.length}</div></div><div class="card"><span class="muted">Questions Answered</span><div class="num">${total}</div></div><div class="card"><span class="muted">Correct Answers</span><div class="num">${correct}</div></div><div class="card"><span class="muted">Accuracy</span><div class="num">${acc}%</div></div></div><br><div class="card"><div class="section-title"><h3>Subject Accuracy</h3></div>${Object.keys(by).length?Object.entries(by).map(([s,v])=>`<div style="margin:17px 0"><div style="display:flex;justify-content:space-between"><b>${esc(s)}</b><span>${Math.round(v.c/v.t*100)}%</span></div><div class="progress" style="margin-top:7px"><i style="width:${v.c/v.t*100}%"></i></div></div>`).join(''):'<div class="empty">Complete a quiz to see your progress.</div>'}</div><br><div class="card"><h3>Attempt History</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Subject</th><th>Score</th><th>Accuracy</th></tr></thead><tbody>${state.scores.slice().reverse().map(s=>`<tr><td>${new Date(s.date).toLocaleString()}</td><td>${esc(s.subject)}</td><td>${s.correct}/${s.total}</td><td>${Math.round(s.correct/s.total*100)}%</td></tr>`).join('')}</tbody></table></div></div>`}
function adminPage(){return head('Admin Panel','Manage MCQs, notes and platform data')+`<div class="grid two"><section class="card"><div class="section-title"><h3>Add MCQ</h3></div><form id="mcqForm"><label>Subject</label><select name="subject">${subjects.slice(1).map(s=>`<option>${s}</option>`).join('')}</select><label>Question</label><textarea name="q" rows="3" required></textarea><label>Options</label><input name="o1" placeholder="Option A" required><input name="o2" placeholder="Option B" required style="margin-top:8px"><input name="o3" placeholder="Option C" required style="margin-top:8px"><input name="o4" placeholder="Option D" required style="margin-top:8px"><label>Correct option</label><select name="a"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><label>Explanation</label><textarea name="e" rows="3"></textarea><button class="btn primary full">Add Question</button></form></section><section class="card"><div class="section-title"><h3>Add Study Note</h3></div><form id="noteForm"><label>Title</label><input name="title" required><label>Subject</label><select name="subject">${subjects.slice(1).map(s=>`<option>${s}</option>`).join('')}</select><label>Note content</label><textarea name="text" rows="12" required></textarea><button class="btn primary full">Add Note</button></form></section></div><br><div class="card"><div class="section-title"><h3>Content Manager</h3><span class="muted">${state.mcqs.length} MCQs • ${state.notes.length} notes</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Type</th><th>Title</th><th>Subject</th><th>Action</th></tr></thead><tbody>${state.mcqs.slice().reverse().map(q=>`<tr><td>MCQ</td><td>${esc(q.q.slice(0,70))}</td><td>${esc(q.subject)}</td><td><button class="btn danger" onclick="deleteMCQ(${q.id})">Delete</button></td></tr>`).join('')}${state.notes.slice().reverse().map(n=>`<tr><td>NOTE</td><td>${esc(n.title)}</td><td>${esc(n.subject)}</td><td><button class="btn danger" onclick="deleteNote(${n.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function bindAuth(){document.getElementById('loginTab').onclick=()=>authMode(false);document.getElementById('signupTab').onclick=()=>authMode(true);document.getElementById('authForm').onsubmit=e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('password').value;const signup=document.getElementById('signupTab').classList.contains('active');if(signup){if(pass.length<6)return toast('Password must be at least 6 characters');const u={email,name:email.split('@')[0],role:'student'};localStorage.setItem('nc_account_'+email,JSON.stringify({email,password:pass,name:u.name,role:'student'}));state.user=u;localStorage.setItem('nc_user',JSON.stringify(u));toast('Account created');render()}else{let u=null;if(email==='student@nursingcareer.com'&&pass==='123456')u={email,name:'Student',role:'student'};else if(email==='admin@nursingcareer.com'&&pass==='admin123')u={email,name:'Admin',role:'admin'};else{const saved=JSON.parse(localStorage.getItem('nc_account_'+email)||'null');if(saved&&saved.password===pass)u={email:saved.email,name:saved.name,role:saved.role}}if(!u)return toast('Invalid email or password');state.user=u;localStorage.setItem('nc_user',JSON.stringify(u));render()}}}
function authMode(signup){document.getElementById('loginTab').classList.toggle('active',!signup);document.getElementById('signupTab').classList.toggle('active',signup);document.querySelector('#authForm .primary').textContent=signup?'Create account →':'Login →';}
function logout(){state.user=null;state.page='home';state.quiz=null;localStorage.removeItem('nc_user');render()}
function toggleTheme(){document.body.classList.toggle('dark');document.body.style.background=document.body.classList.contains('dark')?'#071b1c':'#f4f8f8';toast('Theme toggled')}
function deleteMCQ(id){if(confirm('Delete this question?')){state.mcqs=state.mcqs.filter(q=>q.id!==id);save();render();toast('Question deleted')}}
function deleteNote(id){if(confirm('Delete this note?')){state.notes=state.notes.filter(n=>n.id!==id);save();render();toast('Note deleted')}}
document.addEventListener('submit',e=>{if(e.target.id==='mcqForm'){e.preventDefault();const f=new FormData(e.target);state.mcqs.push({id:Date.now(),subject:f.get('subject'),q:f.get('q'),o:[f.get('o1'),f.get('o2'),f.get('o3'),f.get('o4')],a:+f.get('a'),e:f.get('e')||'Review the relevant nursing concept.'});save();e.target.reset();render();toast('MCQ added')}if(e.target.id==='noteForm'){e.preventDefault();const f=new FormData(e.target);state.notes.push({id:Date.now(),title:f.get('title'),subject:f.get('subject'),type:'PDF',text:f.get('text')});save();e.target.reset();render();toast('Note added')}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){state.query=e.target.value;clearTimeout(window.sr);window.sr=setTimeout(()=>render(),180)}});
load();render();
</script></body></html>
