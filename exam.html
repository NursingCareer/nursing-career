let examSubmitted = false;
let timeLeft = 30 * 60;


/* =====================================================

===================================================== */

document.getElementById("totalQuestions").textContent =
  questionBank.length;


/* =====================================================

===================================================== */

document.getElementById("score").textContent = "0";


/* =====================================================
   RENDER QUESTIONS
===================================================== */

function renderQuestions() {

  const container =
    document.getElementById("questionsContainer");

  let html = "";

  questionBank.forEach(function(item, index) {

    const questionNumber = index + 1;

    html += `
      <div class="question-card">

        <div class="question">
          ${questionNumber}. ${item.q}
        </div>
    `;

    item.options.forEach(function(option, optionIndex) {

      const letter =
        String.fromCharCode(65 + optionIndex);

      html += `
        <label class="option">

          <input
            type="radio"
            name="q${index}"
            value="${optionIndex}"
          >

          ${letter}. ${option}

        </label>
      `;

    });

    html += `
      </div>
    `;

  });

  container.innerHTML = html;
}

renderQuestions();


/* =====================================================
   TIMER
===================================================== */

const timerElement =
  document.getElementById("timer");

const timer = setInterval(function() {

  if (examSubmitted) {
    clearInterval(timer);
    return;
  }

  const minutes =
    Math.floor(timeLeft / 60);

  const seconds =
    timeLeft % 60;

  timerElement.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");

  if (timeLeft <= 0) {

    clearInterval(timer);

    alert(
      "Time is up! Your exam will be submitted automatically."
    );

    submitExam();

    return;
  }

  timeLeft--;

}, 1000);


/* =====================================================
   FORM SUBMIT
===================================================== */

document
  .getElementById("examForm")
  .addEventListener("submit", function(event) {

    event.preventDefault();

    if (examSubmitted) {
      return;
    }

    const confirmed = confirm(
      "Are you sure you want to submit the exam?"
    );

    if (!confirmed) {
      return;
    }

    submitExam();

  });


/* =====================================================
   SUBMIT EXAM
===================================================== */

function submitExam() {

  if (examSubmitted) {
    return;
  }

  examSubmitted = true;

  clearInterval(timer);

  let score = 0;

  let reviewHTML = "";

  questionBank.forEach(function(item, index) {

    const selected =
      document.querySelector(
        `input[name="q${index}"]:checked`
      );

    let userAnswer = null;

    if (selected) {
      userAnswer = Number(selected.value);
    }

    const correctAnswer =
      item.answer;

    const isCorrect =
      userAnswer === correctAnswer;

    if (isCorrect) {
      score++;
    }


    /* User answer text */

    let userAnswerText =
      "Not answered";

    if (userAnswer !== null) {

      userAnswerText =
        String.fromCharCode(65 + userAnswer) +
        ". " +
        item.options[userAnswer];

    }


    /* Correct answer text */

    const correctAnswerText =
      String.fromCharCode(65 + correctAnswer) +
      ". " +
      item.options[correctAnswer];


    /* Review */

    reviewHTML += `
      <div class="review ${isCorrect ? "correct" : "wrong"}">

        <p>
          <strong>
            ${index + 1}. ${item.q}
          </strong>
        </p>

        <p>
          Your Answer:
          <span class="${
            isCorrect
              ? "correct-text"
              : userAnswer === null
                ? "not-answered"
                : "wrong-text"
          }">
            ${userAnswerText}
          </span>
        </p>

        <p>
          Correct Answer:
          <span class="correct-text">
            ${correctAnswerText}
          </span>
        </p>

        <p>
          ${
            isCorrect
              ? "✓ Correct"
              : "✗ Incorrect"
          }
        </p>

      </div>
    `;

  });


  /* Percentage */

  const percentage =
    Math.round(
      (score / questionBank.length) * 100
    );


  /* Result */

  document.getElementById("score").textContent =
    score;

  document.getElementById("percentage").textContent =
    percentage;

  document.getElementById("review").innerHTML =
    reviewHTML;


  /* Hide exam */

  document.getElementById("examSection").style.display =
    "none";


  /* Show result */

  document.getElementById("result").style.display =
    "block";


  /* Scroll top */

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   HOME BUTTON
===================================================== */
