<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nursing Career - Model Test</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#1f2937;
}


/* HEADER */

header{
    background:linear-gradient(135deg,#0f766e,#0891b2);
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.home-btn{
    color:white;
    text-decoration:none;
    background:rgba(255,255,255,.15);
    padding:9px 15px;
    border-radius:8px;
}


/* MAIN */

.container{
    max-width:900px;
    margin:30px auto;
    padding:0 15px;
}


/* TEST HEADER */

.test-header{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.test-header h1{
    color:#0f766e;
    margin-bottom:8px;
}

.test-info{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:18px;
    flex-wrap:wrap;
}

.info-box{
    flex:1;
    min-width:130px;
    background:#f0fdfa;
    padding:14px;
    border-radius:10px;
    text-align:center;
}

.info-box strong{
    display:block;
    font-size:20px;
    color:#0f766e;
}


/* PROGRESS */

.progress-wrap{
    margin-top:20px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:14px;
}

.progress{
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#0f766e;
    transition:.3s;
}


/* QUESTIONS */

.question-card{
    background:white;
    padding:25px;
    border-radius:16px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.question-number{
    display:inline-block;
    background:#ccfbf1;
    color:#0f766e;
    padding:6px 11px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:12px;
}

.question{
    font-size:19px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:18px;
}

.option{
    display:block;
    border:2px solid #e5e7eb;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    border-color:#0f766e;
    background:#f0fdfa;
}

.option input{
    margin-right:10px;
}

.option.selected{
    border-color:#0f766e;
    background:#ecfdf5;
}


/* BUTTON */

.submit-btn,
.retake-btn{
    border:0;
    width:100%;
    padding:15px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:#0f766e;
    margin-top:10px;
}

.submit-btn:hover,
.retake-btn:hover{
    background:#115e59;
}


/* RESULT */

.result{
    display:none;
    background:white;
    padding:35px 25px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.result h2{
    color:#0f766e;
    margin-bottom:15px;
}

.score{
    font-size:48px;
    font-weight:bold;
    color:#0891b2;
    margin:15px 0;
}

.result-message{
    font-size:17px;
    margin-bottom:20px;
}


/* ANSWER REVIEW */

.answer-review{
    margin-top:25px;
    text-align:left;
}

.answer-review h3{
    text-align:center;
    color:#0f766e;
    margin-bottom:15px;
}

.answer-item{
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    line-height:1.6;
}

.answer-item.correct{
    background:#ecfdf5;
    border:1px solid #a7f3d0;
    color:#047857;
}

.answer-item.wrong{
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#b91c1c;
}

.correct-answer{
    font-weight:bold;
    color:#047857;
}


/* FOOTER */

footer{
    text-align:center;
    padding:25px;
    color:#6b7280;
}


/* MOBILE */

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
    }

    .test-header,
    .question-card{
        padding:20px;
    }

    .question{
        font-size:17px;
    }

    .info-box{
        min-width:100%;
    }

    .logo{
        font-size:21px;
    }

}

</style>

</head>
