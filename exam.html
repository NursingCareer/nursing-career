<script>

const answers = {
  q1:"b",
  q2:"c",
  q3:"d",
  q4:"b",
  q5:"b",
  q6:"a",
  q7:"a",
  q8:"c",
  q9:"b",
  q10:"c"
};

const correctAnswers = {
  q1:"B. 12–20 breaths/min",
  q2:"C. Heart",
  q3:"D. Vitamin D",
  q4:"B. 37°C",
  q5:"B. WBC",
  q6:"A. Muscle",
  q7:"A. Blood Pressure",
  q8:"C. Sphygmomanometer",
  q9:"B. Vitamin C",
  q10:"C. Lungs"
};

let timeLeft = 600;
let submitted = false;

const timer = setInterval(function(){

  if(submitted) return;

  let minutes = Math.floor(timeLeft / 60);
  let seconds = timeLeft % 60;

  document.getElementById("timer").textContent =
    String(minutes).padStart(2,"0") + ":" +
    String(seconds).padStart(2,"0");

  if(timeLeft <= 0){
    clearInterval(timer);
    submitTest();
    return;
  }

  timeLeft--;

},1000);


// Answer select highlight
document.querySelectorAll(".option input").forEach(function(input){

  input.addEventListener("change",function(){

    const name = this.name;

    document.querySelectorAll(
      'input[name="' + name + '"]'
    ).forEach(function(item){

      item.parentElement.classList.remove("selected");

    });

    this.parentElement.classList.add("selected");

    updateProgress();

  });

});


// Progress
function updateProgress(){

  let answered = 0;

  for(let i = 1; i <= 10; i++){

    if(
      document.querySelector(
        'input[name="q' + i + '"]:checked'
      )
    ){
      answered++;
    }

  }

  let percent = Math.round((answered / 10) * 100);

  document.getElementById("progressBar").style.width =
    Math.max(percent,10) + "%";

  document.getElementById("progressText").textContent =
    "Answered " + answered + " of 10";

  document.getElementById("progressPercent").textContent =
    percent + "%";

}


// Submit Exam
function submitTest(){

  if(submitted) return;

  submitted = true;
  clearInterval(timer);

  let score = 0;

  let reviewHTML = "";

  for(let i = 1; i <= 10; i++){

    const questionNumber = "q" + i;

    const selected = document.querySelector(
      'input[name="' + questionNumber + '"]:checked'
    );

    const selectedText = selected
      ? selected.parentElement.textContent.trim()
      : "No answer selected";

    const correctText = correctAnswers[questionNumber];

    if(selected && selected.value === answers[questionNumber]){

      score++;

      reviewHTML += `
        <div style="
          text-align:left;
          padding:14px;
          margin:10px 0;
          border-radius:10px;
          background:#ecfdf5;
          border:1px solid #a7f3d0;
        ">
          <strong>Question ${i} — Correct ✓</strong>
          <br>
          Your Answer: ${selectedText}
        </div>
      `;

    }else{

      reviewHTML += `
        <div style="
          text-align:left;
          padding:14px;
          margin:10px 0;
          border-radius:10px;
          background:#fef2f2;
          border:1px solid #fecaca;
        ">
          <strong>Question ${i} — Incorrect ✗</strong>
          <br>
          Your Answer: ${selectedText}
          <br>
          <strong>Correct Answer: ${correctText}</strong>
        </div>
      `;

    }

  }

  const percentage = score * 10;

  document.getElementById("quizForm").style.display = "none";
  document.querySelector(".test-header").style.display = "none";

  document.getElementById("result").style.display = "block";

  document.getElementById("score").textContent =
    score + "/10";

  if(percentage >= 80){

    document.getElementById("resultMessage").textContent =
      "Excellent! Great job. Keep practicing!";

  }else if(percentage >= 50){

    document.getElementById("resultMessage").textContent =
      "Good effort! Practice more to improve your score.";

  }else{

    document.getElementById("resultMessage").textContent =
      "Keep practicing. Review the topics and try again!";

  }


  // Show answer review
  const reviewBox = document.createElement("div");

  reviewBox.innerHTML = `
    <h3 style="
      color:#0f766e;
      margin:25px 0 15px;
    ">
      Answer Review
    </h3>

    ${reviewHTML}
  `;

  document.getElementById("result").appendChild(reviewBox);

  document.getElementById("result").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}

</script>
