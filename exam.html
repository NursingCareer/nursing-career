/* =========================
   RANDOM 60
========================= */

let questions =
    [...database]
    .sort(() => Math.random() - 0.5)
    .slice(0,60);


/* =========================
   SHOW QUESTIONS
========================= */

const box =
    document.getElementById("questions");

questions.forEach((item,index)=>{

    let html =
    `<div class="card">
    <b>${index+1}. ${item.q}</b>`;

    item.o.forEach((option,i)=>{

        html += `
        <label class="option">
        <input
        type="radio"
        name="q${index}"
        value="${i}">
        ${String.fromCharCode(65+i)}. ${option}
        </label>
        `;

    });

    html += `</div>`;

    box.innerHTML += html;

});


/* =========================
   TIMER
========================= */

let seconds = 30 * 60;

const timer =
    document.getElementById("timer");

const countdown =
setInterval(()=>{

    let min =
        Math.floor(seconds/60);

    let sec =
        seconds%60;

    timer.textContent =
        String(min).padStart(2,"0")
        + ":" +
        String(sec).padStart(2,"0");

    if(seconds <= 0){

        clearInterval(countdown);

        submitExam();

    }

    seconds--;

},1000);


/* =========================
   SUBMIT
========================= */

document
.getElementById("form")
.addEventListener("submit",(e)=>{

    e.preventDefault();

    submitExam();

});


function submitExam(){

    clearInterval(countdown);

    let score = 0;

    let unanswered = 0;

    questions.forEach((item,index)=>{

        const selected =
            document.querySelector(
                `input[name="q${index}"]:checked`
            );

        if(!selected){

            unanswered++;

        }else if(
            Number(selected.value)
            === item.a
        ){

            score++;

        }

    });


    let wrong =
        60 - score - unanswered;

    let percentage =
        Math.round(
            score / 60 * 100
        );


    document.getElementById("score")
    .textContent = score;

    document.getElementById("percent")
    .textContent = percentage;

    document.getElementById("correct")
    .textContent = score;

    document.getElementById("wrong")
    .textContent = wrong;

    document.getElementById("unanswered")
    .textContent = unanswered;


    document.getElementById("exam")
    .style.display = "none";

    document.getElementById("result")
    .style.display = "block";

    window.scrollTo(0,0);

}
